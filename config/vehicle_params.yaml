vehicle_width: 1.825      # m, 1825 mm
wheel_base: 2.700         # m, assumed/configurable
rear_overhang: 0.850      # m, assumed/configurable
max_steer_deg: 35.0

# General parking slot dimensions.
parking_slot_width: 2.200   # m
parking_slot_length: 4.400  # m
