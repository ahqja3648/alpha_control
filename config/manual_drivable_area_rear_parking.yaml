frame_id: map

drivable_area:
  # T-shaped manual drivable area: aisle + target parking slot only.
  # Vehicle state uses rear-axle center, but this polygon is expressed in map coordinates.
  outer_polygon:
    - [-2.70, -4.20]
    - [12.80, -4.20]
    - [12.80,  0.70]
    - [ 7.20,  0.70]
    - [ 7.20,  5.14]
    - [ 5.00,  5.14]
    - [ 5.00,  0.70]
    - [-2.70,  0.70]

  forbidden_polygons:
    - name: opposite_side_no_drive_zone
      points:
        - [-2.70, -5.70]
        - [12.80, -5.70]
        - [12.80, -4.20]
        - [-2.70, -4.20]
    - name: left_parking_slots_no_drive_zone
      points:
        - [-2.70, 0.70]
        - [ 5.00, 0.70]
        - [ 5.00, 5.14]
        - [-2.70, 5.14]
    - name: right_parking_slots_no_drive_zone
      points:
        - [ 7.20, 0.70]
        - [12.80, 0.70]
        - [12.80, 5.14]
        - [ 7.20, 5.14]
